name: retention

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: avalix-retention
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Expira intakes e links de treino, e remove erros antigos
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo 'Erro: configure SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY.'
            exit 1
          fi

          call_rpc() {
            local name="$1"
            local body="$2"
            local attempt code curl_rc tmp
            local delays=(5 15 30)
            tmp=$(mktemp)

            for attempt in 1 2 3 4; do
              curl_rc=0
              code=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
                -o "$tmp" -w '%{http_code}' \
                -X POST "${SUPABASE_URL%/}/rest/v1/rpc/$name" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H 'Content-Type: application/json' \
                --data "$body") || curl_rc=$?

              if [ "$curl_rc" -eq 0 ] && [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
                cat "$tmp"
                rm -f "$tmp"
                return 0
              fi

              # Retenta apenas falhas de transporte ou 408/429/5xx/52x; 401/403/404 falham na hora.
              if [ "$attempt" -lt 4 ] && { [ "$curl_rc" -ne 0 ] || [[ "$code" =~ ^(408|429|500|502|503|504|520|522|524)$ ]]; }; then
                local wait_s="${delays[$((attempt - 1))]}"
                echo "Aviso: $name falhou na tentativa $attempt/4 (curl=$curl_rc, HTTP $code); tentando novamente em ${wait_s}s..." >&2
                sleep "$wait_s"
                continue
              fi

              echo "Erro: $name falhou (curl=$curl_rc, HTTP $code)" >&2
              cat "$tmp" >&2
              rm -f "$tmp"
              return 1
            done
          }

          for _ in $(seq 1 20); do
            count=$(call_rpc purge_expired_anamnese_intakes '{"p_limit":500}')
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "Retorno inválido do purge de intakes: $count"; exit 1; }
            [ "$count" -lt 500 ] && break
          done

          for _ in $(seq 1 20); do
            count=$(call_rpc purge_expired_workout_links '{"p_limit":500}')
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "Retorno inválido do purge de links: $count"; exit 1; }
            [ "$count" -lt 500 ] && break
          done

          for _ in $(seq 1 20); do
            count=$(call_rpc purge_client_errors '{"p_limit":5000}')
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "Retorno inválido do purge de erros: $count"; exit 1; }
            [ "$count" -lt 5000 ] && break
          done

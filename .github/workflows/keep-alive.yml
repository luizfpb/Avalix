name: keep-alive

# Mantem o projeto Supabase ativo: o free tier pausa apos ~7 dias sem atividade.
# Faz um GET simples na REST API a cada 3 dias.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   SUPABASE_URL              -> Project URL (ex.: https://xxxx.supabase.co)
#   SUPABASE_PUBLISHABLE_KEY  -> chave publishable (sb_publishable_...)

on:
  schedule:
    - cron: '0 6 */3 * *' # a cada 3 dias, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping REST API
        # Secrets via env (nao interpolar ${{ }} direto no shell): mais seguro e,
        # se faltarem, dao erro claro em vez do enigmatico "exit code 3" do curl
        # (URL vazia = URL malformada).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo 'Erro: configure os secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY'
            echo '(repo > Settings > Secrets and variables > Actions).'
            exit 1
          fi
          delays=(5 15 30)
          for attempt in 1 2 3 4; do
            curl_rc=0
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' \
              "${SUPABASE_URL%/}/rest/v1/organizations?select=id&limit=1" \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}") || curl_rc=$?
            echo "HTTP $code (tentativa $attempt/4, curl=$curl_rc)"
            # 401/403/404 falham na hora: secret inválido não pode parecer saudável.
            if [ "$curl_rc" -eq 0 ] && [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo 'ok: projeto respondeu e a chave foi aceita'
              exit 0
            fi
            if [ "$attempt" -lt 4 ] && { [ "$curl_rc" -ne 0 ] || [[ "$code" =~ ^(408|429|500|502|503|504|520|522|524)$ ]]; }; then
              wait_s="${delays[$((attempt - 1))]}"
              echo "Aviso: falha transitória; tentando novamente em ${wait_s}s..."
              sleep "$wait_s"
              continue
            fi
            echo "falha: sem resposta do servidor (curl=$curl_rc, HTTP $code)"
            exit 1
          done
